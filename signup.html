<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <!-- Animated Background Icons -->
    <div class="background-icons">
        <i class="fa-solid fa-laptop icon icon1"></i>
        <i class="fa-solid fa-user icon icon2"></i>
        <i class="fa-solid fa-shield-halved icon icon3"></i>
        <i class="fa-solid fa-cloud icon icon4"></i>
        <i class="fa-solid fa-code icon icon5"></i>
        <i class="fa-solid fa-lock icon icon6"></i>
        <i class="fa-solid fa-database icon icon7"></i>
        <i class="fa-solid fa-mobile-screen icon icon8"></i>
    </div>

    <div class="signup-wrapper">

        <div class="signup-card">

            <div class="logo">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h1>Create Account</h1>
            <p class="subtitle">Join us and get started today</p>

            <form id="signupForm">

                <!-- Full Name -->
                <div class="input-group">
                    <label for="name">Full Name</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            autocomplete="name">
                    </div>

                    <small class="error" id="nameError"></small>
                </div>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">Email Address</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email">
                    </div>

                    <small class="error" id="emailError"></small>
                </div>

                <!-- Role -->
                <div class="input-group">
                    <label>Select Role</label>

                    <div class="role-container">

                        <label class="role-card">
                            <input
                                type="radio"
                                name="role"
                                value="Admin">

                            <span>
                                <i class="fa-solid fa-user-shield"></i>
                                Admin
                            </span>
                        </label>

                        <label class="role-card">
                            <input
                                type="radio"
                                name="role"
                                value="Customer">

                            <span>
                                <i class="fa-solid fa-user"></i>
                                Customer
                            </span>
                        </label>

                    </div>

                    <small class="error" id="roleError"></small>
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            autocomplete="new-password">

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <small class="error" id="passwordError"></small>
                </div>

                <!-- Confirm Password -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password">

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmPassword">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <small class="error" id="confirmPasswordError"></small>
                </div>

                <!-- Terms -->
                <div class="terms">
                    <input type="checkbox" id="terms">

                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <small class="error" id="termsError"></small>

                <!-- Button -->
                <button type="submit" class="signup-btn">
                    <span>Create Account</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </div>

    <!-- Success Popup -->
    <div class="success-popup" id="successPopup">

        <div class="success-box">

            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h2>Account Created!</h2>

            <p>
                Your account has been created successfully.
            </p>

            <p class="redirect-text">
                Redirecting to login...
            </p>

        </div>

    </div>

    <script src="js/signup.js"></script>

</body>
</html>
